services:
  deorbit:
    build: .
    image: deorbit
    restart: unless-stopped
    # This machine's network, so that the server sees each robot's own address,
    # where Docker's port forwarding gives it that of Docker's gateway, and finds
    # this machine's address for `public_address`. The server then listens on
    # `port` and `web_port` of deorbit.yml here; the web UI has no login, so set
    # `web_host` to 127.0.0.1 there to offer it to this machine only.
    # Docker does this on Linux. With Docker Desktop on a Mac or Windows, put
    # the ports below in place of this line; the container side of each must
    # match `port` and `web_port`.
    network_mode: host
    # ports:
    #   - "3443:3443"
    #   - "8080:8080"
    volumes:
      - ./deorbit.yml:/data/deorbit.yml:ro
      # Writable: with `generate_certs` on, the first start creates the CA and
      # the server certificate here, and later starts reuse them.
      - ./certs:/data/certs
      # The directory of `database` in deorbit.yml, so that what the server
      # remembers about each robot outlasts the container.
      - ./data:/data/data
      # For `keys: keys` in deorbit.yml. Deleting a robot in the web UI removes
      # its key, so mounted read-only, a robot that has one cannot be deleted.
      # - ./keys:/data/keys:ro
