  <meta name="color-scheme" content="dark light">
  <!-- The server writes the version of the page in here, which the script compares with the one the server has. -->
  <meta name="deorbit-version" content="{version}">
  <title>Robots · deorbit</title>
  <!-- Every address here is relative, so the page also works under a path prefix behind a proxy. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#/">
        <svg class="icon mark" aria-hidden="true"><use href="#icon-orbit"/></svg>
        <span>deorbit</span>
      </a>
      <div id="live" class="live" role="status" data-state="loading">
        <span class="dot"></span>
        <span id="live-text">Connecting</span>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="app"></div>
    <noscript><p class="lead">This page needs JavaScript to show the robots.</p></noscript>
  </main>

  <!-- What "Bind a robot" opens over the page. The script fills it. -->
  <dialog id="add" class="add-dialog" aria-labelledby="add-title"></dialog>

  <!-- The toasts that say how something went, over the page. The script fills it, and moves it into the dialog while that is open.
       It is here from the start so that a screen reader hears what is put in it. -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
